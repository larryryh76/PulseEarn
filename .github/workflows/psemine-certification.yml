name: PSEmine pre-release certification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: psemine-certification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend test dependencies
        run: pip install -r api/requirements.txt pytest

      - name: Install Chromium for rendered wallet/UI tests
        run: npx playwright install --with-deps chromium

      - name: TypeScript and production build
        run: npm run build

      - name: Backend unit and regression tests
        run: PYTHONPATH=api/tests python3 -m pytest api/tests -q

      - name: Wallet rendering and injected-wallet discovery
        run: bun scripts/pse-wallet-check.mjs

      - name: Wallet payment, chain guard, cancellation and duplicate-send gate
        run: bun scripts/pse-wallet-gate.mjs

      - name: Wallet session validity, BSC routing and recovery regression
        run: bun scripts/pse-wallet-recovery-check.mjs

      - name: Wallet handoff reload recovery and diagnostics regression
        run: bun scripts/pse-wallet-handoff-check.mjs

      - name: Require authenticated PSEmine QA credentials
        env:
          PSE_TEST_EMAIL: ${{ secrets.PSE_TEST_EMAIL }}
          PSE_TEST_PASSWORD: ${{ secrets.PSE_TEST_PASSWORD }}
        run: |
          if [ -z "$PSE_TEST_EMAIL" ] || [ -z "$PSE_TEST_PASSWORD" ]; then
            echo "::error::Missing dedicated authenticated PSEmine QA credentials."
            exit 1
          fi

      - name: Inspect every authenticated PSEmine page at all target widths
        env:
          PSE_TEST_EMAIL: ${{ secrets.PSE_TEST_EMAIL }}
          PSE_TEST_PASSWORD: ${{ secrets.PSE_TEST_PASSWORD }}
          PSE_TEST_BASE_URL: https://www.pulseearn.online
          PSE_WIDTHS: 390,375,430,768,1024,1440
          PSE_OUT: artifacts/psemine-authenticated-qa
        run: |
          mkdir -p "$PSE_OUT"
          node scripts/pse-authenticated-check.mjs

      - name: Upload complete authenticated page evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psemine-authenticated-qa-${{ github.run_number }}
          path: artifacts/psemine-authenticated-qa/
          if-no-files-found: warn
          retention-days: 14

      - name: Mobile/desktop console rendering smoke tests
        run: bun scripts/pse-console-check.mjs
