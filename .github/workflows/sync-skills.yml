name: Sync Skills

# Pulls the shared skill definitions (ui-ux-pro-max, open-design, design-systems)
# from their upstream repositories into .agents/skills/ and opens one pull request
# with whatever changed. Nothing is ever pushed to main directly.
#
# File mappings live in .github/sync.yml.

on:
  schedule:
    # 00:00 UTC every day.
    - cron: '0 0 * * *'
  workflow_dispatch:

# Scheduled runs can overlap or be delayed, and every run pushes to the same
# branch, so make sure only one sync is in flight at a time.
concurrency:
  group: sync-skills
  cancel-in-progress: false

# Least privilege: the job's own GITHUB_TOKEN only has to read this repository so
# that actions/checkout can fetch it. Everything that writes (branch push and PR
# creation) is done with SYNC_PAT by the sync step below.
permissions:
  contents: read

jobs:
  sync:
    name: Sync skill files from upstream
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v5

      # The upstream repositories are public, so the default GITHUB_TOKEN is
      # enough to read them. They are staged in .sync-src/ and never committed.
      - name: Checkout nextlevelbuilder/ui-ux-pro-max-skill
        uses: actions/checkout@v5
        with:
          repository: nextlevelbuilder/ui-ux-pro-max-skill
          path: .sync-src/ui-ux-pro-max-skill

      - name: Checkout feimacode/open-design-agent-kit
        uses: actions/checkout@v5
        with:
          repository: feimacode/open-design-agent-kit
          path: .sync-src/open-design-agent-kit

      - name: Checkout nexu-io/open-design
        uses: actions/checkout@v5
        with:
          repository: nexu-io/open-design
          path: .sync-src/open-design

      # Fail loudly if an upstream moved or deleted a path we depend on, instead
      # of quietly opening a PR that is missing one of the mappings.
      - name: Verify upstream sources exist
        run: |
          set -euo pipefail
          sources=(
            ".sync-src/ui-ux-pro-max-skill/.claude/skills/ui-ux-pro-max/SKILL.md"
            ".sync-src/ui-ux-pro-max-skill/src/ui-ux-pro-max"
            ".sync-src/open-design-agent-kit/packages/claude-plugin/skills/open-design/SKILL.md"
            ".sync-src/open-design/design-systems"
          )
          missing=0
          for source in "${sources[@]}"; do
            if [ ! -e "$source" ]; then
              echo "::error::Upstream path is missing: $source — update .github/sync.yml and this step."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      # Reads .github/sync.yml and opens/updates a pull request in
      # larryryh76/PulseEarn. OVERWRITE_EXISTING_PR reuses a single long-lived
      # branch, so repeated runs update one PR instead of opening a new one daily.
      - name: Sync skill files and open a pull request
        uses: BetaHuhn/repo-file-sync-action@v1
        with:
          GH_PAT: ${{ secrets.SYNC_PAT }}
          # SYNC_PAT is a fine-grained token, so it is passed with the oauth: prefix.
          # Set this to false if you switch to a classic token.
          IS_FINE_GRAINED: true
          CONFIG_PATH: .github/sync.yml
          # Set explicitly so commits never depend on the token owner's profile
          # exposing a public email address.
          GIT_USERNAME: larryryh76
          GIT_EMAIL: larryryh76@users.noreply.github.com
          COMMIT_PREFIX: 'chore(skills):'
          COMMIT_BODY: Synced from upstream by .github/workflows/sync-skills.yml
          PR_BODY: |
            Automated sync of skill files from their upstream repositories.

            Generated by `.github/workflows/sync-skills.yml`. Review the diff
            before merging — a change here means an upstream skill changed.
          # Labels are created on demand only if they already exist in the repo;
          # they are left off so an unknown label cannot fail an otherwise
          # successful sync. Set to a list of existing labels to enable.
          PR_LABELS: false
          OVERWRITE_EXISTING_PR: true
          COMMIT_EACH_FILE: true
