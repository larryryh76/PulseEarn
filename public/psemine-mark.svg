<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="PSEmine">
  <!--
    PSEmine compact mark — the ore plate with its three sheared capacity bars.
    Drawn for favicon scale: a solid plate keeps the silhouette readable at 16px
    where a hairline outline would disappear. Structure is ink, capacity is the
    accent, and the mark stays recognisable without any glow or gradient.
  -->
