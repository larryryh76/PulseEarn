<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="PSEmine">
  <!--
    PSEmine compact mark — the recovered faceted emblem, drawn for favicon scale.

    Same five facets, same geometry as the in-app mark (src/components/psemine/
    PSEBrand.tsx): an electric-blue blade, a light upper facet notched by the
    inner cut, a steel side facet and the cyan capacity crest.

    The plate is solid ink so the mark keeps its contrast on any browser chrome,
    which a transparent emblem cannot do — the upper facet is bone in the dark
    theme and would disappear on a light toolbar. Flat fills only: no gradient,
    no glow, no shadow, so it survives at 16px.
  -->
  <rect width="48" height="48" rx="9" fill="#0F1116"/>
  <!-- Blade — primary facet -->
  <path d="M8 8L20 4V34L8 42V8Z" fill="#3D74FF"/>
  <!-- Upper facet -->
  <path d="M22 4L38 12L42 16L22 24V4Z" fill="#EDECEC"/>
  <!-- Side facet -->
  <path d="M22 24L42 16L36 30L22 34V24Z" fill="#EDECEC" fill-opacity="0.36"/>
  <!-- Inner cut — back to the plate, so it reads as a void -->
  <path d="M22 10L32 15L22 20V10Z" fill="#0F1116"/>
  <!-- Crest — capacity facet -->
  <path d="M22 37L32 32L36 35L22 44V37Z" fill="#22D3EE"/>
</svg>
