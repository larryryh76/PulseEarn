name: Sync Skills

# Pulls the shared skill definitions (ui-ux-pro-max, open-design, design-systems)
# from their upstream repositories into .agents/skills/, validates what landed,
# and merges it to main once the validation passes.
#
# The daily run is therefore: fetch → validate → merge → delete the branch.
# Nothing merges on a failed validation: the pull request stays open with a
# comment saying which check failed, so the branch can be investigated.
#
# File mappings live in .github/sync.yml.

on:
  schedule:
    # 00:00 UTC every day.
    - cron: '0 0 * * *'
  workflow_dispatch:

# Scheduled runs can overlap or be delayed, and every run pushes to the same
# branch, so make sure only one sync is in flight at a time.
concurrency:
  group: sync-skills
  cancel-in-progress: false

# Least privilege: the job's own GITHUB_TOKEN only has to read this repository so
# that actions/checkout can fetch it. Everything that writes (branch push, PR
# creation, validation, merge, branch deletion) is done with SYNC_PAT.
#
# SYNC_PAT is a fine-grained token and must carry, on larryryh76/PulseEarn:
#   Contents: read and write        (push the sync branch, delete it after merge)
#   Pull requests: read and write   (open, read, comment on and merge the PR)
# Workflows: write is deliberately NOT required: .github/sync.yml never maps a
# file under .github/workflows/ into this repository.
permissions:
  contents: read

jobs:
  sync:
    name: Sync skill files from upstream
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      # Set by the sync action only when it actually created a pull request.
      # Empty means the upstream content is unchanged — see the "no changes"
      # step in the validate job.
      pull_requests: ${{ steps.sync.outputs.pull_request_urls }}

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v5

      # The upstream repositories are public, so the default GITHUB_TOKEN is
      # enough to read them. They are staged in .sync-src/ and never committed.
      - name: Checkout nextlevelbuilder/ui-ux-pro-max-skill
        uses: actions/checkout@v5
        with:
          repository: nextlevelbuilder/ui-ux-pro-max-skill
          path: .sync-src/ui-ux-pro-max-skill

      - name: Checkout feimacode/open-design-agent-kit
        uses: actions/checkout@v5
        with:
          repository: feimacode/open-design-agent-kit
          path: .sync-src/open-design-agent-kit

      - name: Checkout nexu-io/open-design
        uses: actions/checkout@v5
        with:
          repository: nexu-io/open-design
          path: .sync-src/open-design

      # Fail loudly if an upstream moved or deleted a path we depend on, instead
      # of quietly opening a PR that is missing one of the mappings.
      - name: Verify upstream sources exist
        run: |
          set -euo pipefail
          sources=(
            ".sync-src/ui-ux-pro-max-skill/.claude/skills/ui-ux-pro-max/SKILL.md"
            ".sync-src/ui-ux-pro-max-skill/.claude/skills/ui-ux-pro-max/references"
            ".sync-src/ui-ux-pro-max-skill/src/ui-ux-pro-max"
            ".sync-src/open-design-agent-kit/packages/claude-plugin/skills/open-design/SKILL.md"
            ".sync-src/open-design-agent-kit/packages/claude-plugin/skills/open-design/references"
            ".sync-src/open-design/design-systems"
          )
          missing=0
          for source in "${sources[@]}"; do
            if [ ! -e "$source" ]; then
              echo "::error::Upstream path is missing: $source — update .github/sync.yml and this step."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      # Reads .github/sync.yml and opens/updates a pull request in
      # larryryh76/PulseEarn. OVERWRITE_EXISTING_PR reuses a single long-lived
      # branch, so repeated runs update one PR instead of opening a new one daily.
      #
      # When the upstream content is byte-identical to what is already in the
      # repository the action logs "File(s) already up to date", pushes nothing
      # and creates no PR — which is what keeps a daily no-op from producing an
      # empty commit, an empty PR or an empty merge.
      - name: Sync skill files and open a pull request
        id: sync
        uses: BetaHuhn/repo-file-sync-action@v1
        with:
          GH_PAT: ${{ secrets.SYNC_PAT }}
          # SYNC_PAT is a fine-grained token, so it is passed with the oauth: prefix.
          # Set this to false if you switch to a classic token.
          IS_FINE_GRAINED: true
          CONFIG_PATH: .github/sync.yml
          # Set explicitly so commits never depend on the token owner's profile
          # exposing a public email address.
          GIT_USERNAME: larryryh76
          GIT_EMAIL: larryryh76@users.noreply.github.com
          COMMIT_PREFIX: 'chore(skills):'
          COMMIT_BODY: Synced from upstream by .github/workflows/sync-skills.yml
          PR_BODY: |
            Automated sync of skill files from their upstream repositories.

            Generated by `.github/workflows/sync-skills.yml`. This pull request is
            validated and merged automatically when the validation passes; if the
            validation fails it is left open with a comment naming the failure.
          # Labels are created on demand only if they already exist in the repo;
          # they are left off so an unknown label cannot fail an otherwise
          # successful sync. Set to a list of existing labels to enable.
          PR_LABELS: false
          OVERWRITE_EXISTING_PR: true
          COMMIT_EACH_FILE: true

  validate:
    name: Validate the synced content
    needs: sync
    # Only runs when the sync produced a pull request. No PR means the upstream
    # content is unchanged, so there is nothing to validate and nothing to merge.
    if: needs.sync.outputs.pull_requests != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      # The revision that was validated. The merge job refuses to merge anything
      # else, so a push that lands while this job runs cannot slip through.
      validated_sha: ${{ steps.pr.outputs.head_sha }}

    steps:
      - name: Resolve the pull request the sync opened
        id: pr
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
          PR_URLS: ${{ needs.sync.outputs.pull_requests }}
        run: |
          set -euo pipefail
          url=$(printf '%s' "$PR_URLS" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s);process.stdout.write(a[0] ?? "")})')
          if [ -z "$url" ]; then
            echo "::error::The sync action reported a pull request but no URL."
            exit 1
          fi
          number="${url##*/}"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"

          gh pr view "$number" \
            --json headRefName,headRefOid,state,mergeable,mergeStateStatus \
            --jq '"head_ref=" + .headRefName, "head_sha=" + .headRefOid, "state=" + .state, "mergeable=" + .mergeable' \
            | tee -a "$GITHUB_OUTPUT"

      # The pull request branch is based on main, so this checks out exactly the
      # content that would be merged — not the dispatch ref.
      - name: Checkout the pull request branch
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          fetch-depth: 0

      # The gate. Validates the self-declared contracts of everything under
      # .agents/skills/: JSON parses, CSV parses with a stable header, every
      # design-system package satisfies the manifest contract its own README and
      # _schema/AGENTS.md define, and every SKILL.md has front matter naming its
      # own directory. Node builtins only, so it needs no install step.
      - name: Validate synced skill content
        run: node scripts/validate-synced-skills.mjs

      # A skills-only sync cannot affect the app, so the app checks are not run
      # for it. If a mapping is ever added that writes outside .agents/, the
      # branch has to pass the repository's own gates before it can merge.
      - name: Determine what the sync touched
        id: changed
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          set -euo pipefail
          gh pr diff "${{ steps.pr.outputs.number }}" --name-only > changed-files.txt
          echo "Changed files:"
          cat changed-files.txt
          outside=$(grep -v '^\.agents/' changed-files.txt || true)
          if [ -n "$outside" ]; then
            echo "::warning::The sync touched files outside .agents/ — running the full repository checks."
            echo "repo_checks=true" >> "$GITHUB_OUTPUT"
          else
            echo "repo_checks=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Bun
        if: steps.changed.outputs.repo_checks == 'true'
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        if: steps.changed.outputs.repo_checks == 'true'
        run: bun install --frozen-lockfile

      - name: Typecheck
        if: steps.changed.outputs.repo_checks == 'true'
        run: bun tsc -b --noEmit

      - name: Product isolation
        if: steps.changed.outputs.repo_checks == 'true'
        run: bun scripts/check-product-isolation.mjs

      # A failed validation must not merge, and must not silently disappear: the
      # message on the PR is what makes the failure actionable.
      - name: Report the failure on the pull request
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          gh pr comment "${{ steps.pr.outputs.number }}" --body "$(cat <<'EOF'
          Validation failed, so this sync was not merged and the branch was left in place.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          The same validation runs locally with:

          ```
          node scripts/validate-synced-skills.mjs
          ```
          EOF
          )"

  merge:
    name: Merge the validated sync
    needs: [sync, validate]
    if: needs.sync.outputs.pull_requests != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Re-read the pull request head
        id: head
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
          PR_URLS: ${{ needs.sync.outputs.pull_requests }}
        run: |
          set -euo pipefail
          url=$(printf '%s' "$PR_URLS" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s);process.stdout.write(a[0] ?? "")})')
          number="${url##*/}"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          gh pr view "$number" \
            --json headRefOid,state,mergeable,mergeStateStatus \
            --jq '"head_sha=" + .headRefOid, "state=" + .state, "mergeable=" + .mergeable, "merge_state=" + .mergeStateStatus' \
            | tee -a "$GITHUB_OUTPUT"

      # The validated revision must still be the head, and the PR must be
      # mergeable. Either condition failing means the thing that was validated is
      # not the thing that would be merged, so nothing is merged.
      - name: Confirm the validated revision is still the head
        run: |
          set -euo pipefail
          if [ "${{ steps.head.outputs.head_sha }}" != "${{ needs.validate.outputs.validated_sha }}" ]; then
            echo "::error::The pull request moved after validation (${{ needs.validate.outputs.validated_sha }} → ${{ steps.head.outputs.head_sha }}) — not merging. The next run will re-validate and merge."
            exit 1
          fi
          if [ "${{ steps.head.outputs.mergeable }}" != "MERGEABLE" ]; then
            echo "::error::The pull request is not mergeable (mergeable=${{ steps.head.outputs.mergeable }}, state=${{ steps.head.outputs.merge_state }}) — not merging."
            exit 1
          fi

      # Squash merge keeps one commit per sync on main even though the sync
      # branch commits each file separately. --delete-branch removes the sync
      # branch, so the next run starts from a clean ref.
      - name: Merge the squash commit and delete the branch
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          gh pr merge "${{ steps.head.outputs.number }}" \
            --squash \
            --delete-branch \
            --subject "chore(skills): sync skill files from upstream" \
            --body "Validated by .github/workflows/sync-skills.yml and merged automatically."
          gh pr view "${{ steps.head.outputs.number }}" --json state,mergeCommit --jq '"state=" + .state + " merge_commit=" + (.mergeCommit.oid // "none")'
